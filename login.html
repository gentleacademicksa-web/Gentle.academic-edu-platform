<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | Gentle Academic</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">

        <h1>🎓 Gentle Academic</h1>

        <p>تسجيل الدخول إلى المنصة</p>

    </div>

</header>

<section>

    <h2>تسجيل الدخول</h2>

    <form onsubmit="login(event)">

        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
            required>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            required>

        <button type="submit">

            تسجيل الدخول

        </button>

    </form>

    <br>

    <div class="text-center">

        <p>

            ليس لديك حساب؟

        </p>

        <a href="student.html" class="btn">

            إنشاء حساب طالب

        </a>

    </div>

</section>

<footer>

    <p>

        © 2026 Gentle Academic

    </p>

</footer>

<script src="script.js"></script>

</body>

</html>
